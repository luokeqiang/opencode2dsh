name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/plugin
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.4.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: packages/plugin/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      # The suite imports the built artifacts (lib/index.js, lib/client.js).
      - name: Build
        run: |
          pnpm build
          pnpm build:client

      - name: Test
        run: pnpm test

      - name: Pack
        run: |
          mkdir -p dist
          pnpm pack --pack-destination dist

      - name: Checksums
        run: |
          cd dist
          sha256sum *.tgz > SHA256SUMS

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/*.tgz dist/SHA256SUMS \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
