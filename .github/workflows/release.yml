name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/plugin
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.4.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: packages/plugin/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      # Fail fast before the build if the tag and the changelog disagree.
      - name: Validate release version
        run: |
          version="${GITHUB_REF_NAME#v}"
          package_version="$(node -p "require('./package.json').version")"
          test "$version" = "$package_version" || {
            echo "tag $GITHUB_REF_NAME does not match package.json $package_version" >&2
            exit 1
          }
          grep -Eq "^## \\[$version\\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" ../../CHANGELOG.md || {
            echo "CHANGELOG.md has no dated section for $version" >&2
            exit 1
          }

      - name: Typecheck
        run: pnpm typecheck

      # The suite imports the built artifacts (lib/index.js, lib/client.js).
      - name: Build
        run: |
          pnpm build
          pnpm build:client

      - name: Test
        run: pnpm test

      - name: Pack
        run: |
          mkdir -p dist
          pnpm pack --pack-destination dist

      - name: Checksums
        run: |
          cd dist
          test "$(ls -1 *.tgz | wc -l)" -eq 1 || {
            echo "expected exactly one tarball" >&2
            exit 1
          }
          sha256sum *.tgz > SHA256SUMS
          sha256sum -c SHA256SUMS

      # Prefer a concise release-notes/<tag>.md; fall back to the full
      # CHANGELOG section. GitHub's --generate-notes is unusable here because
      # direct pushes have no PRs and produce only a compare link.
      - name: Compose release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          test -s dist/SHA256SUMS || {
            echo "dist/SHA256SUMS is missing" >&2
            exit 1
          }
          notes_file="../../release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$notes_file" ]; then
            cp "$notes_file" dist/RELEASE_NOTES.md
          else
            echo "no release-notes/${GITHUB_REF_NAME}.md; falling back to CHANGELOG.md" >&2
            awk -v prefix="## [$version] - " '
              index($0, prefix) == 1 { capture = 1; print; next }
              capture && /^## / { exit }
              capture { print }
            ' ../../CHANGELOG.md > dist/RELEASE_NOTES.md
          fi
          test -s dist/RELEASE_NOTES.md || {
            echo "no release notes for $GITHUB_REF_NAME" >&2
            exit 1
          }
          perl -0pi -e 's/\n+\z/\n/' dist/RELEASE_NOTES.md

          if previous="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null)"; then
            compare_url="https://github.com/${GITHUB_REPOSITORY}/compare/${previous}...${GITHUB_REF_NAME}"
          else
            compare_url="https://github.com/${GITHUB_REPOSITORY}/commits/${GITHUB_REF_NAME}"
          fi

          cat >> dist/RELEASE_NOTES.md <<EOF

          ### Install

          \`\`\`bash
          gh release download ${GITHUB_REF_NAME} --repo ${GITHUB_REPOSITORY} --pattern '*.tgz' --pattern 'SHA256SUMS'
          sha256sum -c SHA256SUMS
          dsh plugin --profile web add ./opencode2dsh-dsh-plugin-${version}.tgz
          \`\`\`

          ### Checksums

          \`\`\`text
          $(cat dist/SHA256SUMS)
          \`\`\`

          **Full Changelog**: ${compare_url}
          EOF

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/*.tgz dist/SHA256SUMS \
            --title "$GITHUB_REF_NAME" \
            --notes-file dist/RELEASE_NOTES.md
